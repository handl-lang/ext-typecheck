[package]
name = "hnl-ext-typecheck"
version = "0.1.0"
edition = "2024"
description = "`hnl typecheck`/`hnl check` — the canonical typechecker as a dynamic `hnl` extension (ADR-0149)."
license = "MIT"
repository = "https://github.com/handl-lang/ext-typecheck"
homepage = "https://handl-lang.github.io/docs/ext-typecheck/"
documentation = "https://handl-lang.github.io/docs/ext-typecheck/reference/"
readme = "README.md"
keywords = ["handl", "extension", "cli"]
categories = ["development-tools"]
# Git-install only: https://github.com/handl-lang/ext-typecheck (no crates.io).
publish = false

[lib]
# `cdylib` is the shipped artifact (`libhnl_ext_typecheck.{so,dylib,dll}`);
# `rlib` keeps `cargo test` statically linked (ADR-0149 §Consequences).
crate-type = ["cdylib", "rlib"]

[dependencies]
handl-ext = { git = "https://github.com/handl-lang/kernel", branch = "main" }
handl-language = { git = "https://github.com/handl-lang/kernel", branch = "main" }
handl-kit-prelude = { git = "https://github.com/handl-lang/kit-prelude", branch = "main" }
handl-kit-pkg = { git = "https://github.com/handl-lang/kit-pkg", branch = "main" }
handl-platform = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-plugin-ext-detect = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-plugin-ext-diag = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-plugin-ext-typecheck = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-plugin-ext-refinement = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-runtime = { git = "https://github.com/handl-lang/host", branch = "main" }
serde_json = "1"

[profile.dev]
opt-level = 1
